<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>prismatix — local copilot</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
  :root { --bg:#0f1115; --panel:#151a22; --line:#232b38; --fg:#dde3ee; --dim:#8a94a7;
          --acc:#69b7ff; --ok:#7bd88f; --warn:#f4bf75; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.55 -apple-system, "SF Mono", Menlo, monospace; }
  header { display:flex; justify-content:space-between; align-items:center;
           padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  header b { color:var(--acc); }
  header small { color:var(--dim); }
  main { height:calc(100vh - 118px); overflow-y:auto; padding:14px 16px; }
  .msg { margin:10px 0; }
  .you .badge { color:var(--warn); font-weight:600; }
  .you .text { white-space:pre-wrap; }
  .bot { border-left:2px solid var(--line); padding-left:12px; }
  .bot pre { background:var(--panel); border:1px solid var(--line);
             padding:10px; overflow-x:auto; }
  .tool { font:13px Menlo, monospace; background:var(--panel);
          border:1px solid var(--line); border-radius:6px;
          padding:6px 10px; margin:8px 0; color:var(--dim); }
  .tool .n { color:#c792ea; font-weight:600; }
  .tool .o { display:block; margin-top:4px; color:#6d7889; }
  .err { color:#ec6a5e; }
  .stats { color:var(--dim); font-size:12px; margin-top:6px; }
  form { display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line);
         background:var(--panel); position:fixed; bottom:0; left:0; right:0; }
  select, input { background:#0d1016; color:var(--fg); border:1px solid var(--line);
                  border-radius:8px; padding:10px; font:inherit; }
  input { flex:1; }
  button { background:var(--acc); color:#08243f; border:0; border-radius:8px;
           padding:10px 16px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body>
<header>
  <div><b>prismatix</b> · local copilot <small>by sentin3l-mrb</small></div>
  <small id="health">loading…</small>
</header>
<main id="log"></main>
<form id="prompt">
  <select id="mode">
    <option value="chat">/chat</option>
    <option value="sql">/sql</option>
    <option value="brief">/brief</option>
    <option value="email">/email</option>
    <option value="rag">/rag</option>
    <option value="agent">/do (agent)</option>
  </select>
  <input id="q" placeholder="ask anything · nothing leaves this machine" autocomplete="off"/>
  <button id="send">send</button>
</form>

<script>
const log = document.getElementById("log");
const modeSel = document.getElementById("mode");
const qBox = document.getElementById("q");
const sendBtn = document.getElementById("send");
let busy = false;

fetch("/api/health").then(r => r.json()).then(h =>
  document.getElementById("health").textContent =
    h.model + " · " + h.chunks + " indexed chunks");

function esc(s) { return s.replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }

// minimal markdown: fenced code blocks + bold + inline code; no CDN needed
function md(s) {
  let out = "", i = 0;
  const parts = s.split("```");
  for (let k = 0; k < parts.length; k++) {
    if (k % 2 === 1) out += "<pre>" + esc(parts[k].replace(/^\w*\n/, "")) + "</pre>";
    else out += esc(parts[k])
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
  }
  return out;
}

function push(cls, html) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = html;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function readSSE(url, handlers) {
  const es = new EventSource(url);
  for (const [name, fn] of Object.entries(handlers)) es.addEventListener(name, fn);
  es.addEventListener("error", () => {
    if (!es.streamDone) handlers.onEnd("connection error — engine still running?");
    es.close();
  });
  return es;
}

document.getElementById("prompt").addEventListener("submit", (e) => {
  e.preventDefault();
  if (busy || !qBox.value.trim()) return;
  const mode = modeSel.value, q = qBox.value.trim();
  qBox.value = "";
  busy = true; sendBtn.disabled = true;

  const isAgent = (mode === "agent");
  push("you", `<span class="badge">${esc(mode)}</span> <span class="text">${esc(q)}</span>`);
  const bot = push("bot", "<em>…</em>");
  let text = "", ended = false;

  const onEnd = (err) => {
    if (ended) return; ended = true; es.close();
    if (err) bot.insertAdjacentHTML("beforeend",
      `<div class="err">${esc(err)}</div>`);
    busy = false; sendBtn.disabled = false; qBox.focus();
  };

  const url = isAgent
    ? `/api/agent?q=${encodeURIComponent(q)}`
    : `/api/chat?q=${encodeURIComponent(q)}&mode=${mode}`;
  const es = new EventSource(url); let es_ = es; es.streamDone = false;

  es.addEventListener("meta", () => {
    bot.innerHTML = isAgent ? "" : "<em>thinking… (first token may take ~2s)</em>";
    if (isAgent) bot.innerHTML = "<em>agent running…</em>";
  });
  es.addEventListener("token", (ev) => {
    const { text: t } = JSON.parse(ev.data);
    text += t;
    bot.innerHTML = `<span class="text">${md(text)}</span>▌`;
    log.scrollTop = log.scrollHeight;
  });
  es.addEventListener("tool", (ev) => {
    const { name, args, output } = JSON.parse(ev.data);
    const row = document.createElement("div");
    row.className = "tool";
    row.innerHTML = `<span class="n">${esc(name)}</span> ${esc(JSON.stringify(args))}` +
                    (output ? `<span class="o">${esc(output)}</span>` : "");
    log.insertBefore(row, bot.parentNode === log ? bot : null);
    log.scrollTop = log.scrollHeight;
  });
  es.addEventListener("stats", (ev) => {
    const { words, secs } = JSON.parse(ev.data);
    bot.insertAdjacentHTML("beforeend",
      `<div class="stats">${words} words · ${secs}s · local</div>`);
  });
  es.addEventListener("answer", (ev) => {
    bot.innerHTML = `<span class="text">${md(JSON.parse(ev.data).text || "")}</span>`;
    es.streamDone = true; onEnd();
  });
  es.addEventListener("error", (ev) => {
    if (ev.data) { const { message: m } = JSON.parse(ev.data);
      bot.insertAdjacentHTML("beforeend", `<div class="err">${esc(m)}</div>`); }
    es.streamDone = true; onEnd();
  });
  // keep form focus available
  qBox.focus();
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && document.activeElement !== qBox) qBox.focus();
});
</script>
</body>
</html>
