# Prismatix LoRA training config (mlx-lm `--config` schema).
# v2 recipe after the v1 run degenerated (LOG #14): lr 1e-4 x scale 20 was too
# aggressive -> train loss 0.09 but generations looped. 10x lower lr and
# half the scale keeps the adapter as a gentle style nudge.
model: "mlx-community/Qwen3.5-4B-4bit"
train: true
data: "training/split"
fine_tune_type: "lora"
optimizer: "adamw"
batch_size: 1
iters: 200
val_batches: 8
learning_rate: 1e-5
steps_per_report: 20
steps_per_eval: 100
save_every: 100
adapter_path: "adapters/prismatix-style-v3"
grad_checkpoint: true
grad_accumulation_steps: 4
mask_prompt: true
seed: 42
lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 2.0
